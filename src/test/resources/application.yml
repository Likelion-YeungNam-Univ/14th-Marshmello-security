spring:
  security:
    oauth2:
      client:
        registration:
          oidc:
            provider: test-provider
            client-id: test-client
            client-secret: test-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,email
        provider:
          test-provider:
            authorization-uri: https://idp.example.test/authorize
            token-uri: https://idp.example.test/token
            jwk-set-uri: https://idp.example.test/jwks
            user-info-uri: https://idp.example.test/userinfo
            user-name-attribute: sub

app:
  oidc:
    google-offline-access: false
  authorization:
    allowed-emails:
      - allowed@example.com
    allowed-email-domains:
      - trusted.example
    allowed-subjects:
      - subject-allowlisted
    require-verified-email: true
